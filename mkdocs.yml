site_name: Indice de Diversité Exposée
site_description: >-
  Mesurer la diversité qu'un fil algorithmique expose réellement — et éprouver ce
  qu'on croit en savoir.
site_author: Sylvain Geffroy
site_url: https://s-geffroy.github.io/Indice-Diversite-Exposee/
repo_url: https://github.com/s-geffroy/Indice-Diversite-Exposee
repo_name: s-geffroy/Indice-Diversite-Exposee
copyright: >-
  Code sous licence MIT · contenus rédactionnels sous licence CC BY 4.0 ·
  un travail de <a href="https://www.ligne-de-crete.fr/travaux/indice-diversite-exposee/">Ligne de crête</a>

docs_dir: docs
# `docs/notebooks/` et `docs/figures/` sont recopiés depuis la racine avant le build
# (voir docker-compose.yml et .github/workflows/pages.yml) : les notebooks restent à
# leur place canonique, exécutable par `docker compose run --rm notebooks`, sans être
# dupliqués dans le dépôt.

theme:
  name: material
  language: fr
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Passer au thème sombre
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Passer au thème clair
  features:
    # navigation.instant est volontairement absent : il est incompatible avec le
    # sélecteur de langue contextuel de mkdocs-static-i18n.
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.follow
    - search.highlight

plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: fr
          name: Français
          default: true
          build: true
        - locale: en
          name: English
          build: true
          site_name: Exposed Diversity Index
          nav_translations:
            Théorie: Theory
            Entropie: Entropy
            Température sociale: Social temperature
            Fokker-Planck: Fokker-Planck
            Résonance: Resonance
            Instruments: Instruments
            IDE — l'index: EDI — the index
            ADE — l'algorithme: EDA — the algorithm
            Calibration empirique: Empirical calibration
            Changements de régime: Regime changes
            Corpus étendu: Extended corpus
            Annotation en aveugle: Blind annotation
            Test adverse de l'index: Adversarial test of the index
            Rang et contrefactuel: Rank and counterfactual
            Rang adverse et sévérité: Adversarial rank and severity
            Exploration réelle de MIND: MIND's real exploration
            Journaux qui enregistrent le rang: Logs that record the rank
            Demande au titre de l'article 40: Article 40 data request
            Lignes de base: Baselines
            Contre-expertise: Counter-expertise
            Les deux angles morts: The two blind spots
            Le test de forme: The form test
            Exposition mesurée: Measured exposure
            Format et retour: Format and return
            Bibliographie: Bibliography
            Mémorandum de régulation: Regulatory memorandum
            Réserves: Caveats
            Audit critique et limites: Critical audit and limitations
            Feuille de route: Roadmap
            Errata: Errata
            Appel à relecture: Call for review
            Notebooks: Notebooks

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.blocks.caption
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascript/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/s-geffroy/Indice-Diversite-Exposee

nav:
  - Introduction: index.md
  - Théorie:
      - Entropie: theorie/entropie.md
      - Température sociale: theorie/temperature.md
      - Fokker-Planck: theorie/fokker-planck.md
      - Résonance: theorie/resonance.md
  - Instruments:
      - IDE — l'index: ide.md
      - ADE — l'algorithme: ade.md
      - Calibration empirique: calibration.md
      - Changements de régime: regimes.md
      - Corpus étendu: corpus-etendu.md
      - Annotation en aveugle: annotation.md
      - Test adverse de l'index: gaming.md
      - Rang et contrefactuel: evaluation.md
      - Rang adverse et sévérité: rang-adverse.md
      - Exploration réelle de MIND: mind.md
      - Journaux qui enregistrent le rang: rang-servi.md
      - Demande au titre de l'article 40: article-40.md
      - Lignes de base: lignes-de-base.md
      - Contre-expertise: contre-expertise.md
      - Les deux angles morts: angles-morts.md
      - Le test de forme: test-de-forme.md
      - Exposition mesurée: exposition-mesuree.md
      - Format et retour: format-et-retour.md
      - L'effet de page: effet-de-page.md
      - L'indice mesuré: indice-mesure.md
